<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <section class="login min-vh-100 d-flex align-items-center">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card login-card">
                        <div class="card-body p-5 text-center">

                            <h3 class="mb-5">Iniciar sesion</h3>

                            <div class="login-logo"></div>

                            <form id="loginForm">

                                <!-- Redes sociales -->
                                <div class="d-flex align-items-center justify-content-center justify-content-lg-start">
                                    <p class="lead fw-normal mb-0 me-3">Iniciar sesión con</p>

                                    <button type="button" class="btn btn-primary btn-floating mx-1">
                                        <i class="fab fa-facebook-f"></i>
                                    </button>
                                    <button type="button" class="btn btn-primary btn-floating mx-1">
                                        <i class="fab fa-twitter"></i>
                                    </button>
                                    <button type="button" class="btn btn-primary btn-floating mx-1">
                                        <i class="fab fa-linkedin-in"></i>
                                    </button>
                                </div>

                                <hr class="my-4">

                                <!-- Email -->
                                <div class="mb-4">
                                    <input type="email" name="email" id="form3Example3"
                                           class="form-control form-control-lg"
                                           placeholder="Ingresa un email válido" required>
                                    <label class="form-label" for="form3Example3">Email</label>
                                </div>

                                <!-- Contraseña -->
                                <div class="mb-3">
                                    <input type="password" name="contraseña" id="form3Example4"
                                           class="form-control form-control-lg"
                                           placeholder="Ingresa tu contraseña" required>
                                    <label class="form-label" for="form3Example4">Contraseña</label>
                                </div>

                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="form-check mb-0">
                                        <input class="form-check-input me-2" type="checkbox" id="form2Example3">
                                        <label class="form-check-label" for="form2Example3">Recuerdame</label>
                                    </div>
                                    <a href="#">Olvido su contraseña?</a>
                                </div>

                                <!-- Enviar -->
                                <div class="text-center text-lg-start mt-4 pt-2">
                                    <button type="submit" class="btn btn-primary btn-lg px-5">acceder</button>

                                    <p class="small fw-bold mt-2 pt-1 mb-0">
                                        ¿No tiene cuenta?
                                        <a href="registro.html">Registro</a>
                                    </p>
                                </div>
                            </form>

                            <!-- Otros accesos -->
                            <div class="mt-4">
                                <button type="button" class="btn btn-lg btn-google">
                                    <i class="fab fa-google me-2"></i>Google
                                </button>
                                <button type="button" class="btn btn-lg btn-facebook">
                                    <i class="fab fa-facebook-f me-2"></i>Facebook
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const datos = {
                email: this.email.value,
                "contraseña": this["contraseña"].value
            };

            try {
                const resp = await fetch("login.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
                const r = await resp.json();

                alert(r.mensaje);
                if (r.estado) window.location.href = r.redirect;
            } catch (err) {
                alert("Error de conexión con el servidor");
            }
        });
    </script>
</body>
</html>
